[project]
name = "selfplay-worlds"
version = "0.1.0"
description = "Common environments and infrastructure for multi-agent LLM self-play in strategic social games."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed for real model inference (OpenRouter or a vLLM server).
llm = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfplay_worlds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
